<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%2302060c' stroke='%234fd8ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234fd8ff'/%3E%3C/svg%3E" />
    <title>F.R.I.D.A.Y.</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <header>
        <span class="brand">F.R.I.D.A.Y.</span>
        <button id="settingsbtn" type="button" title="Nastaveni" aria-label="Nastaveni" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>
    </div>
    <canvas id="orbmini" width="140" height="140"></canvas>
    <div id="orbstate" aria-live="polite"></div>
    <div id="dock">
      <button id="mic" type="button" title="Mikrofon">MIC</button>
      <button id="stopbtn" type="button" title="Zastavit vse (Esc)" aria-label="Zastavit vse">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
      <button id="camerabtn" type="button" title="Kamera" aria-label="Kamera" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 8h4l1.5-2.5h7L17 8h4v11H3z"/><circle cx="12" cy="13" r="3.6"/></svg>
      </button>
      <button id="screenbtn" type="button" title="Obrazovka" aria-label="Obrazovka" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16.5V20"/></svg>
      </button>
      <button id="chatbtn" type="button" title="Chat" aria-label="Chat" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v11H10l-4 3.5V16H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
        <span id="chatbadge" hidden>0</span>
      </button>
      <button id="membtn" type="button" title="Pamet" aria-label="Pamet">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="7" r="1.8"/><circle cx="17" cy="19" r="1.8"/><path d="M10 10L6.4 7.2M14.8 10.6l2.8-2.4M13 14.8l2.8 3"/></svg>
      </button>
    </div>
    <div id="capprev" hidden>
      <video muted playsinline></video>
      <span class="cap-tag"><i class="cap-dot"></i><b>LIVE</b></span>
      <button type="button" class="cap-flip" title="Prepnout kameru" aria-label="Prepnout kameru">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8a8 8 0 0 0-14-2M4 4v3h3M4 16a8 8 0 0 0 14 2M20 20v-3h-3"/></svg>
      </button>
    </div>
    <div id="capnote" aria-live="polite"></div>
    <div id="caption" aria-live="polite"></div>
    <aside id="chat" aria-hidden="true">
      <div id="log"></div>
      <div id="live"></div>
      <form id="form">
        <button id="attach" type="button" title="Pripojit obrazek" aria-label="Pripojit obrazek"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-8 8a5 5 0 01-7-7l8.5-8.5a3.3 3.3 0 014.7 4.7L9.6 17.1a1.7 1.7 0 01-2.4-2.4l7.6-7.6"/></svg></button>
        <input id="attachfile" type="file" accept="image/*" hidden />
        <input id="input" autocomplete="off" placeholder="Napis Friday..." />
        <button type="submit">&#9654;</button>
      </form>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
